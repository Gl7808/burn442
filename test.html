<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимация логотипа</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        /* ПРЕЛОАДЕР */
        .preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* ВАШ ЛОГОТИП */
        #logo-svg {
            width: 150px; /* Настройте размер под себя */
            height: auto;
        }

        .cls-1 {
            fill: none;
            stroke: #fff;
            stroke-miterlimit: 10;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;

            /* Ключевые свойства для анимации */
            stroke-dasharray: var(--path-length);
            stroke-dashoffset: var(--path-length);
            animation: drawLogo 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes drawLogo {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Основной контент */
        .site-content {
            padding: 50px;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Прелоадер -->
<div class="preloader">
    <svg id="logo-svg" viewBox="0 0 186.97 286.39" xmlns="http://www.w3.org/2000/svg">
        <g id="logo">

        </g>
    </svg>
</div>

<!-- Основной контент -->
<div class="site-content">
    <h1>Сайт загружен!</h1>
    <p>Здесь будет ваш основной контент.</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const preloader = document.querySelector('.preloader');
        const path = document.querySelector('.cls-1');

        // Вычисляем реальную длину вашего пути
        const length = path.getTotalLength();

        // Передаем длину в CSS-переменную
        path.style.setProperty('--path-length', length);

        // Ждем окончания анимации
        path.addEventListener('animationend', () => {
            // Пауза, чтобы увидеть готовый логотип
            setTimeout(() => {
                preloader.classList.add('hidden');

                // Удаляем прелоадер из DOM
                setTimeout(() => {
                    preloader.remove();
                }, 800);
            }, 600);
        });
    });
</script>
</body>
</html>
